<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Resident | BarangayConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        h1 {
            color: #123c69;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-button {
            background: #123c69;
            color: white;
        }

        .back-button {
            background: #e5e7eb;
            color: #222;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add New Resident</h1>
        <p>Enter the resident's information below.</p>

        <form id="residentForm">
            <div class="form-grid">

                <div class="field">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" required>
                </div>

                <div class="field">
                    <label for="middle_name">Middle Name</label>
                    <input type="text" id="middle_name">
                </div>

                <div class="field">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" required>
                </div>

                <div class="field">
                    <label for="suffix">Suffix</label>
                    <input type="text" id="suffix" placeholder="Jr., Sr., III">
                </div>

                <div class="field">
                    <label for="birth_date">Birth Date</label>
                    <input type="date" id="birth_date" required>
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="field full-width">
                    <label for="address">Complete Address</label>
                    <input type="text" id="address" required>
                </div>

                <div class="field full-width">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email">
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="save-button">Save Resident</button>
                <button type="button" class="back-button"
                    onclick="history.back()">Back</button>
            </div>
        </form>
        <p id="formMessage"></p>

<script>
    const residentForm = document.getElementById("residentForm");
    const formMessage = document.getElementById("formMessage");

    residentForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const residentData = {
            first_name: document.getElementById("first_name").value,
            middle_name: document.getElementById("middle_name").value,
            surname: document.getElementById("surname").value,
            suffix: document.getElementById("suffix").value,
            birth_date: document.getElementById("birth_date").value,
            address: document.getElementById("address").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value
        };

        try {
            const response = await fetch("/api/admin/residents", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify(residentData)
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Unable to add resident.");
            }

            formMessage.textContent =
                "Resident added successfully! Resident ID: " +
                result.resident.resident_id;

            formMessage.style.color = "green";
            residentForm.reset();

        } catch (error) {
            formMessage.textContent = error.message;
            formMessage.style.color = "red";
        }
    });
</script>
    </div>
</body>
</html>
